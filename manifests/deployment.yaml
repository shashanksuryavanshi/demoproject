apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: java-demo }
  template:
    metadata:
      labels: { app: java-demo }
    spec:
      containers:
      - name: java-demo
        image: emfiacrdev.azurecr.io/java-demo:5
        ports:
        - containerPort: 8080
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { cpu: 500m, memory: 512Mi }
        readinessProbe:
          httpGet: { path: /, port: 8080 }
          initialDelaySeconds: 20
